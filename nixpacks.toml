# Replace nixpacks.toml with fixed version
@'
[build]
command = "python -m pip install -r backend/requirements.txt"

[deploy]
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"

[phases.install]
cmds = ["python -m pip install -r backend/requirements.txt"]

[phases.setup]
nixPkgs = ["python311"]

[environment]
PYTHONPATH = "backend"
'@ | Out-File -FilePath nixpacks.toml -Encoding ASCII